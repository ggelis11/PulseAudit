<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Suivi des audits de pilotage du développement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F9;
  --surface:#FFFFFF;
  --surface-alt:#E8ECF8;
  --ink:#141B2C;
  --ink-soft:#525C77;
  --ink-faint:#8892AA;
  --line:#DCE1F0;
  --line-soft:#EBEEF9;
  --primary:#2C4A78;
  --primary-dark:#1A3155;
  --primary-soft:#E3E9F5;
  --success:#12A66E;
  --success-soft:#DEF6E9;
  --warning:#E0932A;
  --warning-soft:#FCEFD9;
  --danger:#E2503E;
  --danger-soft:#FBE6E2;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --shadow-card:0 1px 2px rgba(20,27,44,0.05), 0 4px 16px rgba(20,27,44,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--primary-soft);}

.shell{max-width:1180px;margin:0 auto;padding:0 20px 64px;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(242,244,249,0.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3E6099,var(--primary-dark));box-shadow:0 3px 10px rgba(44,74,120,0.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark svg{width:18px;height:18px;}
.app-footer{max-width:1180px;margin:36px auto 10px;padding:22px 20px 0;border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;}
.footer-logo{height:24px;width:auto;opacity:0.8;}
.app-footer{flex-direction:column;gap:6px;}
.footer-version{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);letter-spacing:0.02em;}
.brand-text{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-0.01em;line-height:1.2;}
.brand-sub{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);letter-spacing:0.02em;margin-top:2px;}
.org-logo{height:30px;width:auto;flex-shrink:0;margin-right:6px;}
.tabs{display:flex;gap:4px;background:var(--surface-alt);padding:4px;border-radius:11px;}
.tab-btn{border:none;background:transparent;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:background .15s,color .15s;white-space:nowrap;}
.tab-btn.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-card);}
.tab-btn:hover:not(.active){color:var(--ink);}
main{padding-top:28px;}

h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
.page-head{margin-bottom:22px;}
.page-head h1{font-size:23px;font-weight:700;}
.page-head p{color:var(--ink-soft);margin:4px 0 0;font-size:14px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow-card);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;border:1px solid transparent;font-size:13.5px;font-weight:600;transition:all .15s;}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(44,74,120,0.28);}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 3px 10px rgba(44,74,120,0.38);}
.btn-primary:disabled{box-shadow:none;}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-danger-text{background:transparent;color:var(--danger);border:none;padding:6px 8px;font-size:13px;font-weight:600;}
.btn-danger-text:hover{text-decoration:underline;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:600;font-family:var(--font-mono);}
.badge-success{background:var(--success-soft);color:#166B4A;}
.badge-warning{background:var(--warning-soft);color:#8A5F10;}
.badge-danger{background:var(--danger-soft);color:#9A3229;}
.badge-neutral{background:var(--surface-alt);color:var(--ink-soft);}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px;}
.kpi-card{padding:20px;position:relative;overflow:hidden;}
.kpi-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
.kpi-value{font-family:var(--font-mono);font-size:34px;font-weight:600;margin-top:8px;line-height:1;}
.kpi-sub{font-size:12px;color:var(--ink-faint);margin-top:6px;}
.kpi-bar{height:5px;border-radius:4px;background:var(--surface-alt);margin-top:14px;overflow:hidden;}
.kpi-bar-fill{height:100%;border-radius:4px;}

.section-title{font-size:14.5px;font-weight:700;font-family:var(--font-display);margin:30px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.chart-card{padding:22px 22px 14px;margin-bottom:20px;}
.chart-row{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px;}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.chart-bars{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center;}
.chart-bar{width:11px;border-radius:3px 3px 0 0;background:var(--line);position:relative;transition:height .3s;}
.chart-bar.reserved{background:var(--warning);}
.chart-bar.completed{background:var(--primary);}
.chart-label{font-size:10.5px;color:var(--ink-faint);font-family:var(--font-mono);margin-top:2px;}
.chart-legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);padding:10px 0 4px;border-top:1px solid var(--line-soft);margin-top:6px;}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;}

.svc-table{width:100%;border-collapse:collapse;}
.svc-table th{text-align:left;font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.03em;font-weight:600;padding:0 14px 8px;}
.svc-table td{padding:11px 14px;border-top:1px solid var(--line-soft);font-size:13.5px;}
.svc-table td.num{font-family:var(--font-mono);}
.svc-row-clickable{cursor:pointer;transition:background .12s;}
.svc-row-clickable:hover{background:var(--surface-alt);}
.modal-audit-line{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;transition:background .12s;margin-bottom:6px;}
.modal-audit-line:hover{background:var(--surface-alt);}
.modal-audit-line .t1{font-weight:600;font-size:13px;}
.modal-audit-line .t2{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.hbar-list{padding:10px 6px;}
.hbar-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
.hbar-label{flex:0 0 38%;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbar-track{flex:1;height:14px;background:var(--surface-alt);border-radius:4px;overflow:hidden;}
.hbar-fill{height:100%;border-radius:4px;transition:width .4s ease;}
.hbar-value{flex:0 0 40px;text-align:right;font-family:var(--font-mono);font-size:12px;font-weight:600;}
@media (max-width:640px){ .hbar-label{flex-basis:34%;font-size:11.5px;} }

.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.week-nav .btn-ghost{padding:8px 10px;}
.week-label{font-family:var(--font-mono);font-size:13.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:9px;flex:1;text-align:center;}
.week-jump{margin-left:auto;}
.view-toggle{display:flex;gap:4px;background:var(--surface-alt);padding:4px;border-radius:11px;margin-bottom:18px;width:fit-content;}
.toggle-btn{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);}
.toggle-btn.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-card);}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow-card);background:var(--surface);}
.plan-grid{display:grid;grid-template-columns:60px repeat(5,minmax(140px,1fr));min-width:680px;}
.grid-head{background:var(--primary);color:#fff;font-weight:700;font-size:13px;padding:11px 6px;text-align:center;font-family:var(--font-display);position:sticky;top:0;z-index:1;}
.grid-head.hour-head{background:var(--primary-dark);}
.grid-hour-label{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);padding:3px 8px 0 0;text-align:right;border-top:1px solid var(--line-soft);}
.grid-cell{border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft);display:flex;gap:2px;padding:2px;align-items:stretch;overflow:hidden;}
.grid-cell.past-day{background-image:repeating-linear-gradient(45deg, var(--surface-alt) 0, var(--surface-alt) 5px, transparent 5px, transparent 10px);}
.grid-head.past{opacity:.5;}
.grid-slot.st-locked{background:transparent;border:1.5px dashed var(--line);cursor:not-allowed;opacity:.55;}
.grid-slot.st-locked .gs-name,.grid-slot.st-locked .gs-sub{color:var(--ink-faint);}
.grid-slot{flex:1;min-width:0;border-radius:5px;display:flex;flex-direction:column;justify-content:center;padding:2px 5px;cursor:pointer;line-height:1.2;transition:transform .12s,box-shadow .12s;}
.grid-slot:hover{transform:scale(1.04);z-index:2;box-shadow:0 3px 10px rgba(20,27,44,0.18);}
.grid-slot.st-empty{background:transparent;border:1.5px dashed var(--svc-color);opacity:.6;}
.grid-slot.st-empty .gs-name,.grid-slot.st-empty .gs-sub{color:var(--svc-color);}
.grid-slot.st-reserved{background:var(--svc-color);opacity:.88;}
.grid-slot.st-completed{background:var(--svc-color);}
.grid-slot.st-reserved .gs-name,.grid-slot.st-reserved .gs-sub,.grid-slot.st-completed .gs-name,.grid-slot.st-completed .gs-sub{color:#fff;}
.gs-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gs-sub{font-size:10px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.grid-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-size:12px;color:var(--ink-soft);align-items:center;}
.legend-swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.grid-legend-note{font-size:11.5px;color:var(--ink-faint);width:100%;margin-top:2px;}

.day-block{margin-bottom:26px;}
.day-heading{font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--ink-soft);margin-bottom:10px;padding-left:2px;}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.slot-card{padding:15px;border-left:4px solid var(--line);position:relative;}
.slot-card.st-empty{border-left-color:var(--ink-faint);}
.slot-card.st-reserved{border-left-color:var(--warning);}
.slot-card.st-completed{border-left-color:var(--success);}
.slot-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.slot-time{font-family:var(--font-mono);font-weight:600;font-size:15px;}
.slot-service{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.slot-label{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
.slot-body{margin-top:10px;}
.slot-name{font-size:13px;color:var(--ink);font-weight:600;}
.slot-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
.reserve-form{margin-top:10px;display:flex;gap:6px;}
.reserve-form input{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;}
.empty-note{color:var(--ink-faint);font-size:12.5px;font-style:italic;}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);}
.empty-state svg{width:36px;height:36px;margin-bottom:10px;opacity:.5;}

.audit-header{padding:20px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.audit-meta{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.crit-list{display:flex;flex-direction:column;gap:10px;}
.crit-group-title{font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-top:8px;padding-bottom:5px;border-bottom:1px solid var(--line);}
.crit-group-title:first-child{margin-top:0;}
.crit-card{padding:16px 18px;}
.crit-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;}
.crit-num{font-family:var(--font-mono);color:var(--ink-faint);font-size:12px;margin-right:8px;}
.crit-text{font-size:14.5px;font-weight:600;line-height:1.35;}
.seg{display:flex;gap:6px;}
.seg-btn{flex:1;padding:10px 4px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;text-align:center;transition:all .12s;color:var(--ink-soft);}
.seg-btn[data-v="1"].active{background:var(--success-soft);border-color:var(--success);color:#146B48;}
.seg-btn[data-v="0.5"].active{background:var(--warning-soft);border-color:var(--warning);color:#7A5410;}
.seg-btn[data-v="0"].active{background:var(--danger-soft);border-color:var(--danger);color:#8C2C22;}
.note-card{padding:16px 18px;margin-top:4px;}
.note-card label{font-size:13px;font-weight:700;display:block;margin-bottom:8px;}
.note-card textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13.5px;resize:vertical;}
.audit-footer{position:sticky;bottom:0;background:linear-gradient(to top, var(--bg) 60%, transparent);padding:18px 0 6px;margin-top:6px;display:flex;gap:10px;justify-content:flex-end;align-items:center;}
.audit-progress{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft);margin-right:auto;}
.result-banner{display:flex;align-items:center;gap:14px;padding:18px;margin-bottom:18px;}
.result-score{font-family:var(--font-mono);font-size:30px;font-weight:600;}

.cfg-section{padding:20px 22px;margin-bottom:18px;}
.cfg-section h3{font-size:15px;margin-bottom:3px;}
.cfg-section p.hint{font-size:12.5px;color:var(--ink-faint);margin:2px 0 14px;}
.cfg-list{display:flex;flex-wrap:wrap;gap:8px;}
.cfg-chip{background:var(--surface-alt);border-radius:100px;padding:6px 13px;font-size:13px;font-weight:600;}
.cfg-line{padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cfg-line:first-of-type{border-top:none;}
.cfg-line .t1{font-weight:600;}
.cfg-line .t2{color:var(--ink-soft);font-family:var(--font-mono);font-size:12.5px;}
.cfg-line-actions{display:flex;gap:2px;flex-shrink:0;}
.icon-btn{background:transparent;border:none;color:var(--ink-faint);font-size:14px;padding:5px 7px;border-radius:6px;cursor:pointer;line-height:1;}
.icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);}
.cfg-edit-row{display:flex;gap:6px;flex-wrap:wrap;flex:1;align-items:center;}
.cfg-edit-row input,.cfg-edit-row select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;}
.cfg-edit-row input[type="text"]{flex:1;min-width:120px;}
.cfg-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);}
.cfg-add-flash{animation:cfgFlash 1s ease;border-radius:10px;}
@keyframes cfgFlash{0%{background:var(--primary-soft);}100%{background:transparent;}}
.modal-overlay{position:fixed;inset:0;background:rgba(20,27,44,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal-card{background:var(--surface);border-radius:var(--radius-l);padding:24px;max-width:380px;width:100%;box-shadow:0 16px 44px rgba(20,27,44,0.28);}
.modal-card h3{font-family:var(--font-display);font-size:16px;margin-bottom:4px;}
.modal-card .modal-sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
.modal-card label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;}
.modal-card select,.modal-card input[type="text"]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;box-sizing:border-box;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.cfg-add input,.cfg-add select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;}
.cfg-add input[type="text"]{flex:1;min-width:120px;}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);}
.status-pill.ok .status-dot{background:var(--success);}
.status-pill.err .status-dot{background:var(--danger);}

@media (max-width:640px){
  .topbar-inner{gap:10px;}
  .tabs{width:100%;order:3;}
  .tab-btn{flex:1;text-align:center;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .kpi-value{font-size:26px;}
  .slot-grid{grid-template-columns:1fr;}
  .seg-btn{font-size:12px;padding:12px 2px;}
}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner" id="topbar-inner">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><rect x="6" y="4" width="12" height="16" rx="2" stroke="white" stroke-width="1.8"/><rect x="9" y="2.3" width="6" height="3" rx="1" fill="white"/><path d="M9 12.3l2.2 2.2L15.6 9.6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<script>
/* ============================= API (Google Sheet via Apps Script) ============================= */
const API_URL = "https://script.google.com/macros/s/AKfycbwNSzbcxarcSIsEy1HNrDoUAmG1EhvQbTqir5iCkzHhJUP30Ji-cOKyU79X3CoQav5oSw/exec";

let lastApiOk = true;

async function apiGet(sheet){
  try{
    const bust = Date.now() + '_' + Math.random().toString(36).slice(2);
    const res = await fetch(`${API_URL}?sheet=${encodeURIComponent(sheet)}&_=${bust}`, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    lastApiOk = true;
    return Array.isArray(data) ? data : [];
  }catch(e){
    console.error('apiGet failed', sheet, e);
    lastApiOk = false;
    return [];
  }
}
async function apiGetAll(){
  try{
    const bust = Date.now() + '_' + Math.random().toString(36).slice(2);
    const res = await fetch(`${API_URL}?all=1&_=${bust}`, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    lastApiOk = true;
    return data || {};
  }catch(e){
    console.error('apiGetAll failed', e);
    lastApiOk = false;
    return null;
  }
}
async function apiUpsert(sheet, row){
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'}, // évite le preflight CORS, Apps Script ne gère pas OPTIONS
      body: JSON.stringify({sheet, action:'upsert', row})
    });
    const data = await res.json();
    lastApiOk = !!(data && data.ok);
    return lastApiOk;
  }catch(e){
    console.error('apiUpsert failed', sheet, row, e);
    lastApiOk = false;
    return false;
  }
}
async function apiAppend(sheet, row){
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({sheet, action:'append', row})
    });
    const data = await res.json();
    lastApiOk = !!(data && data.ok);
    return lastApiOk ? data : null;
  }catch(e){
    console.error('apiAppend failed', sheet, row, e);
    lastApiOk = false;
    return null;
  }
}
async function apiAppendMany(sheet, rows){
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({sheet, action:'appendMany', rows})
    });
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){
    console.error('apiAppendMany failed', sheet, e);
    return false;
  }
}
async function apiUpdateRow(sheet, rowNum, data){
  try{

}

/* ============================= DATE / WEEK HELPERS ============================= */
function mondayOf(d){ d=new Date(d); const day=d.getDay(); const diff=(day===0?-6:1-day); d.setDate(d.getDate()+diff); d.setHours(0,0,0,0); return d; }
function toKey(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function currentWeekKey(){ return toKey(mondayOf(new Date())); }
function addWeeks(key,n){ const d=new Date(key+'T00:00:00'); d.setDate(d.getDate()+7*n); return toKey(d); }
function weekLabel(key){
  const monday=new Date(key+'T00:00:00'); const friday=new Date(monday); friday.setDate(monday.getDate()+4);
  const fmt=d=>d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
  return `${fmt(monday)} – ${fmt(friday)} ${friday.getFullYear()}`;
}
function weeksBetween(startKey,endKey){
  const out=[]; let k=startKey; let guard=0;
  while(k<=endKey && guard<500){ out.push(k); k=addWeeks(k,1); guard++; }
  return out;
}
const DAY_NAMES=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
function isServiceActive(name){
  const m = State.serviceMeta[name];
  return !m || m.active;
}
function isPastDay(weekKey, dayIdx){
  const d = new Date(weekKey+'T00:00:00');
  d.setDate(d.getDate()+dayIdx);
  return toKey(d) < toKey(new Date());
}

// Google Sheets renvoie parfois les cellules "heure"/"date" comme des objets Date sérialisés (epoch 1899) — on normalise.
function extractTime(v){
  if(v===null||v===undefined||v==='') return '';
  const s = String(v);
  // Sheets a converti la cellule en horaire : ancrée au 30/12/1899 (toujours en heure standard, UTC+1 à Zurich),
  // donc systématiquement décalée d'1h par rapport à l'heure locale saisie, quel que soit le mois réel de la réunion.
  const legacy = s.match(/^1899-12-30T(\d{2}):(\d{2})/);
  if(legacy){
    let hh = (parseInt(legacy[1],10) + 1) % 24;
    return `${String(hh).padStart(2,'0')}:${legacy[2]}`;
  }
  const m = s.match(/T(\d{2}):(\d{2})/);
  if(m) return `${m[1]}:${m[2]}`;
  return s.slice(0,5);
}
function extractDateStr(v){
  if(v===null||v===undefined||v==='') return '';
  const s = String(v);
  const m = s.match(/^(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : s;
}

function templateId(t){ return `${DAY_NAMES[t.day]}|${t.time}|${t.service}`; }
function rowId(weekKey, t){ return `${weekKey}|${templateId(t)}`; }

async function loadAllData(){
  const data = await apiGetAll();
  if(!data) return false;
  const services = data.Services || [];
  const creneaux = data.Creneaux || [];
  const criteres = data.Criteres || [];
  const auditeurs = data.Auditeurs || [];
  State.services = services.map(r=>r['Nom du service']).filter(Boolean);
  State.serviceMeta = {};
  services.forEach(r=>{
    const name = r['Nom du service'];
    if(!name) return;
    const raw = String(r['Actif']||'').trim().toLowerCase();
    const active = !(raw==='non' || raw==='false' || raw==='0');
    State.serviceMeta[name] = { active, row: r['_row'] };
  });
  State.templates = creneaux
    .filter(r=>r['Jour'] && r['Service'])
    .map(r=>{
      const day = DAY_NAMES.indexOf(String(r['Jour']).trim());
      return { day: day<0?0:day, time: extractTime(r['Heure']), service: String(r['Service']).trim(), label: r['Libellé']||'', row: r['_row'] };
    });
  State.criteria = criteres
    .filter(r=>r['Critère'])
    .sort((a,b)=> (Number(a['Ordre'])||0) - (Number(b['Ordre'])||0))
    .map(r=>({ label: String(r['Critère']), category: String(r['Catégorie']||'').trim(), row: r['_row'] }));
  State.auditors = auditeurs.map(r=>r["Nom de l'auditeur"]).filter(Boolean);
  State.auditsRows = data.Audits_MM || [];
  State.auditDetailRows = data.Audits_Detail || [];
  State.loaded = true;
  return true;
}

function findRow(weekKey, t){
  const id = rowId(weekKey, t);
  return State.auditsRows.find(r=>r['ID']===id) || null;
}

async function upsertRow(t, patch){
  const weekKey = State.weekKey;
  const existing = findRow(weekKey, t) || {};
  const row = {
    ID: rowId(weekKey, t),
    Semaine: weekKey,
    Jour: DAY_NAMES[t.day],
    Service: t.service,
    Heure: t.time,
    Auditeur: existing['Auditeur'] || '',
    Statut: existing['Statut'] || '',
    'Score (%)': existing['Score (%)'] || '',
    'Réservé le': existing['Réservé le'] || '',
    'Audité le': existing['Audité le'] || '',
    'Remarques': existing['Remarques'] || '',
    ...patch
  };
  const ok = await apiUpsert('Audits_MM', row);
  if(ok){
    const idx = State.auditsRows.findIndex(r=>r['ID']===row.ID);
    if(idx>=0) State.auditsRows[idx] = row; else State.auditsRows.push(row);
  }
  return ok;
}

async function computeStats(){
  const rows = State.auditsRows;
  const weeksFound = [...new Set(rows.map(r=>{
    const id = String(r['ID']||'');
    const wk = id.split('|')[0];
    return /^\d{4}-\d{2}-\d{2}$/.test(wk) ? wk : '';
  }).filter(Boolean))].sort();
  const earliest = weeksFound.length ? weeksFound[0] : currentWeekKey();
  const range = weeksBetween(earliest, currentWeekKey());
  const total = State.templates.length;

  let reserved=0, completed=0, totalSlots=0, scoreSum=0;
  const perWeek = [];
  const perService = {};
  State.services.forEach(name=>perService[name]={completed:0,total:0,scoreSum:0,name});
  const perAuditor = {};
  State.auditors.forEach(name=>perAuditor[name]={completed:0,scoreSum:0,name});

  for(const wk of range){
    let wReserved=0, wCompleted=0;
    State.templates.forEach(t=>{
      totalSlots++;
      perService[t.service] = perService[t.service] || {completed:0,total:0,scoreSum:0,name:t.service};
      perService[t.service].total++;
      const row = rows.find(r=>r['ID']===rowId(wk,t));
      if(row && row['Auditeur']){
        reserved++; wReserved++;
        if(row['Statut']==='Réalisé'){
          const sc = Number(row['Score (%)'])/100 || 0;
          completed++; wCompleted++; scoreSum+=sc;
          perService[t.service].completed++; perService[t.service].scoreSum+=sc;
          const auditorName = row['Auditeur'];
          perAuditor[auditorName] = perAuditor[auditorName] || {completed:0,scoreSum:0,name:auditorName};
          perAuditor[auditorName].completed++; perAuditor[auditorName].scoreSum+=sc;
        }
      }
    });
    perWeek.push({week:wk, reserved:wReserved, completed:wCompleted, total});
  }
  return {reserved, completed, totalSlots, scoreSum, perWeek: perWeek.slice(-8), perService, perAuditor, range};
}

function computeCriteriaStats(serviceFilter){
  const byLabel = {};
  State.auditDetailRows.forEach(r=>{
    if(serviceFilter && r['Service']!==serviceFilter) return;
    const label = r['Critère'];
    if(!label) return;
    byLabel[label] = byLabel[label] || {sum:0, count:0, category: r['Catégorie']||''};
    const sc = Number(r['Score (%)']);
    byLabel[label].sum += isNaN(sc)?0:sc;
    byLabel[label].count += 1;
  });
  return Object.entries(byLabel)
    .map(([label,v])=>({label, category:v.category, avg: v.count?Math.round(v.sum/v.count):null, count:v.count}))
    .sort((a,b)=>(a.avg===null?101:a.avg) - (b.avg===null?101:b.avg));
}

function serviceColor(service){

function renderPlanningGridHTML(){
  const toMin = t => { const [h,m] = t.time.split(':').map(Number); return h*60+m; };
  const minM = Math.min(...State.templates.map(toMin));
  const maxM = Math.max(...State.templates.map(toMin));
  const startM = Math.floor(minM/60)*60;
  const endM = Math.min(23*60+45, maxM + 60); // une heure de marge après le dernier créneau
  const rows = [];
  for(let m=startM; m<=endM; m+=15) rows.push(m);

  // une ligne n'occupe une hauteur confortable que si elle contient au moins un créneau (n'importe quel jour) ;
  // les lignes vides sont compressées pour que toute la plage tienne à l'écran sans scroller.
  const rowHasSlot = m => State.templates.some(x=>toMin(x)===m);
  const rowHeights = rows.map(m=>{
    if(rowHasSlot(m)) return 36;
    return (m%60===0) ? 17 : 5;
  });

  let cells = `<div class="grid-head hour-head">Heure</div>` + DAY_NAMES.map((d,i)=>`<div class="grid-head${isPastDay(State.weekKey,i)?' past':''}">${d}</div>`).join('');

  rows.forEach(m=>{
    const hh = String(Math.floor(m/60)).padStart(2,'0');
    const mm = String(m%60).padStart(2,'0');
    const label = mm==='00' ? `${hh}h` : '';
    cells += `<div class="grid-hour-label">${label}</div>`;
    for(let day=0; day<5; day++){
      const past = isPastDay(State.weekKey, day);
      const matches = State.templates.filter(x=>x.day===day && toMin(x)===m);
      if(matches.length===0){ cells += `<div class="grid-cell${past?' past-day':''}"></div>`; continue; }
      const slots = matches.map(t=>{
        const tid = templateId(t).replace(/[^a-zA-Z0-9]/g,'_');
        const row = findRow(State.weekKey, t);
        const status = row && row['Statut']==='Réalisé' ? 'completed' : (row && row['Auditeur'] ? 'reserved' : 'empty');
        const color = serviceColor(t.service);
        const inactive = !isServiceActive(t.service);
        const locked = status==='empty' && (past || inactive);
        let inner;
        if(status==='completed'){
          const pct = Math.round(Number(row['Score (%)'])||0);
          inner = `<div class="gs-name">${escapeHtml(t.service)}</div><div class="gs-sub">✓ ${pct}%</div>`;
        } else if(status==='reserved'){
          inner = `<div class="gs-name">${escapeHtml(t.service)}</div><div class="gs-sub">${escapeHtml(row['Auditeur'])}</div>`;
        } else if(locked){
          inner = `<div class="gs-name">${escapeHtml(t.service)}</div><div class="gs-sub">${inactive && !past ? 'Bientôt' : 'Passé'}</div>`;
        } else {
          inner = `<div class="gs-name">${escapeHtml(t.service)}</div><div class="gs-sub">Libre</div>`;
        }
        const cls = locked ? 'st-locked' : `st-${status}`;
        const clickAttr = locked ? '' : `onclick="gridSlotClick('${tid}')"`;
        const titleText = locked
          ? (inactive && !past ? `${escapeHtml(t.service)} · pas encore disponible à la réservation` : `${escapeHtml(t.service)} · créneau passé, réservation impossible`)
          : `${escapeHtml(t.service)} · ${t.time}${t.label?' · '+escapeHtml(t.label):''}`;
        return `<div class="grid-slot ${cls}" style="--svc-color:${color}" title="${titleText}" ${clickAttr}>${inner}</div>`;
      }).join('');
      cells += `<div class="grid-cell${past?' past-day':''}">${slots}</div>`;
    }
  });

  const legendServices = State.services.map(s=>`<span><span class="legend-swatch" style="background:${serviceColor(s)}"></span>${escapeHtml(s)}</span>`).join('');
  const gridRowsStyle = 'auto ' + rowHeights.map(h=>h+'px').join(' ');

  return `
  <div class="grid-wrap"><div class="plan-grid" style="grid-template-rows:${gridRowsStyle}">${cells}</div></div>
  <div class="grid-legend">
    ${legendServices}
    <span class="grid-legend-note">Contour pointillé = libre · bloc plein = réservé ou réalisé · zone hachurée = jour passé (réservation impossible) · cliquez un créneau pour agir.</span>
  </div>
  `;
}

function renderSlotCard(t){
  const row = findRow(State.weekKey, t);
  const status = row && row['Statut']==='Réalisé' ? 'completed' : (row && row['Auditeur'] ? 'reserved' : 'empty');
  const tid = templateId(t).replace(/[^a-zA-Z0-9]/g,'_');
  const past = isPastDay(State.weekKey, t.day);
  const inactive = !isServiceActive(t.service);
  let inner = '';
  if(status==='empty'){
    inner = inactive ? `
      <div class="slot-body"><span class="empty-note">Pas encore disponible</span></div>` : past ? `
      <div class="slot-body"><span class="empty-note">Jour passé — réservation impossible</span></div>` : `
      <div class="slot-body"><span class="empty-note">Aucun auditeur inscrit</span></div>
      <div class="slot-actions">
        <button class="btn btn-primary btn-sm" onclick="openReserveModal('${tid}')">Réserver</button>
      </div>`;
  } else if(status==='reserved'){
    inner = `
      <div class="slot-body"><div class="slot-name">👤 ${escapeHtml(row['Auditeur'])}</div><span class="badge badge-warning">Réservé</span></div>
      <div class="slot-actions">
        <button class="btn btn-primary btn-sm" onclick="startAudit('${tid}')">Démarrer l'audit</button>
        <button class="btn-danger-text btn-sm" onclick="cancelReservation('${tid}')">Annuler</button>
      </div>`;
  } else {
    const pct = Math.round(Number(row['Score (%)'])||0);
    const cls = pct>=85?'badge-success':(pct>=60?'badge-warning':'badge-danger');
    inner = `
      <div class="slot-body"><div class="slot-name">👤 ${escapeHtml(row['Auditeur'])}</div>
      <span class="badge ${cls}">Audit réalisé · ${pct}%</span></div>
      <div class="slot-actions">
        <button class="btn btn-ghost btn-sm" onclick="viewAudit('${tid}')">Voir le résultat</button>
      </div>`;
  }
  window.__tplIndex = window.__tplIndex || {};
  window.__tplIndex[tid] = t;
  return `<div class="card slot-card st-${status}"${(past||inactive) && status==='empty' ? ' style="opacity:.6;"' : ''}>
    <div class="slot-top">
      <div><div class="slot-time">${t.time}</div><div class="slot-service">${escapeHtml(t.service)}</div>
      ${t.label?`<div class="slot-label">${escapeHtml(t.label)}</div>`:''}</div>
    </div>
    ${inner}
  </div>`;
}

function renderAuditHTML(){
  const ctx = State.auditCtx;

  if(ctx.mode==='view'){
    const row = State.auditsRows.find(r=>r['ID']===ctx.auditId);
    if(!row){
      return `<div class="card empty-state">Audit introuvable.</div><button class="btn btn-ghost" style="margin-top:10px" onclick="goTo('dashboard')">Retour au tableau de bord</button>`;
    }
    const pct = Math.round(Number(row['Score (%)'])||0);
    const cls = pct>=85?'success':(pct>=60?'warning':'danger');
    const details = State.auditDetailRows.filter(d=>d['AuditID']===row['ID']);
    let detailHtml;
    if(details.length){
      const groups = []; const pos = {};
      details.forEach(d=>{
        const key = d['Catégorie'] || '';
        if(!(key in pos)){ pos[key] = groups.length; groups.push({category:key, items:[]}); }
        groups[pos[key]].items.push(d);
      });
      detailHtml = `<div class="crit-list">` + groups.map(g=>{
        const header = g.category ? `<div class="crit-group-title">${escapeHtml(g.category)}</div>` : '';
        const cards = g.items.map(d=>{
          const lab = d['Réponse'];
          const dcls = lab==='Oui'?'success':(lab==='Partiel'?'warning':'danger');
          return `<div class="card crit-card"><div class="crit-top"><div class="crit-text">${escapeHtml(d['Critère'])}</div><span class="badge badge-${dcls}">${escapeHtml(lab)}</span></div></div>`;
        }).join('');
        return header + cards;
      }).join('') + `</div>`;
    } else {
      detailHtml = `<div class="card" style="padding:16px 18px;"><p style="font-size:13px;color:var(--ink-soft);margin:0;">Détail par critère non disponible pour cet audit (réalisé avant l'activation de cette fonctionnalité).</p></div>`;
    }
    return `
    <button class="btn btn-ghost btn-sm" onclick="goTo('planning')" style="margin-bottom:16px;">← Retour au planning</button>
    <div class="card result-banner">
      <div class="result-score" style="color:var(--${cls})">${pct}%</div>
      <div><div style="font-weight:700;">${escapeHtml(row['Service'])} · ${escapeHtml(extractTime(row['Heure']))}</div>
      <div class="audit-meta">Audité par ${escapeHtml(row['Auditeur'])}${row['Audité le']?` · ${new Date(row['Audité le']).toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}`:''}</div></div>
    </div>
    ${row['Remarques'] ? `<div class="card note-card"><label>Remarques</label><div style="font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap;">${escapeHtml(row['Remarques'])}</div></div>` : ''}
    ${detailHtml}
    `;
  }

  const t = tplFromId(ctx.tid);
  const row = findRow(State.weekKey, t);
  if(!t || !row){
    return `<div class="card empty-state">Créneau introuvable.</div><button class="btn btn-ghost" style="margin-top:10px" onclick="goTo('planning')">Retour au planning</button>`;
  }

  const answered = Object.keys(ctx.answers).length;
  const critGroups = [];
  const catPos = {};
  State.criteria.forEach((c,i)=>{
    const key = c.category || '';
    if(!(key in catPos)){ catPos[key] = critGroups.length; critGroups.push({category:key, items:[]}); }
    critGroups[catPos[key]].items.push({c,i});
  });
  let critCounter = 0;
  const critHtml = critGroups.map(g=>{
    const header = g.category ? `<div class="crit-group-title">${escapeHtml(g.category)}</div>` : '';
    const cards = g.items.map(({c,i})=>{
      critCounter++;
      const cur = ctx.answers[i];
      const seg = [['1','Oui'],['0.5','Partiel'],['0','Non']].map(([v,lab])=>
        `<button type="button" class="seg-btn ${cur===parseFloat(v)?'active':''}" data-v="${v}" onclick="setAnswer(${i}, ${v})">${lab}</button>`
      ).join('');
      return `<div class="card crit-card">
        <div class="crit-top"><div class="crit-text"><span class="crit-num">${String(critCounter).padStart(2,'0')}</span>${escapeHtml(c.label)}</div></div>
        <div class="seg">${seg}</div>
      </div>`;
    }).join('');
    return header + cards;
  }).join('');

  return `
  <div class="audit-header card">
    <div>
      <h2 style="font-size:18px;">Audit MM · ${escapeHtml(t.service)}</h2>
      <div class="audit-meta">${DAY_NAMES[t.day]} ${t.time} · ${weekLabel(State.weekKey)} · Auditeur : ${escapeHtml(row['Auditeur'])}</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="exitAudit()">Annuler</button>
  </div>
  <div class="crit-list">${critHtml}</div>
  <div class="card note-card">
    <label>Remarques générales (facultatif)</label>
    <textarea id="audit-note" placeholder="Points marquants, à discuter en direct avec l'équipe…" oninput="ctxUpdateNote(this.value)">${escapeHtml(ctx.note||'')}</textarea>
  </div>
  <div class="audit-footer">
    <div class="audit-progress">${answered}/${State.criteria.length} critères renseignés</div>
    <button class="btn btn-primary" ${answered<State.criteria.length?'disabled':''} onclick="submitAudit()">Enregistrer l'audit</button>
  </div>
  `;
}

function setAnswer(i, val){ State.auditCtx.answers[i] = val; renderUI(); }
function ctxUpdateNote(v){ State.auditCtx.note = v; }
function exitAudit(){ State.view='planning'; State.auditCtx=null; renderUI(); }
window.setAnswer = setAnswer; window.ctxUpdateNote = ctxUpdateNote; window.exitAudit = exitAudit;

async function submitAudit(){
  const ctx = State.auditCtx;
  if(Object.keys(ctx.answers).length < State.criteria.length) return;
  const values = State.criteria.map((_,i)=>ctx.answers[i]);
  const score = values.reduce((a,b)=>a+b,0)/values.length;
  const t = tplFromId(ctx.tid);
  const btn = document.querySelector('.audit-footer .btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Enregistrement…'; }
  const ok = await upsertRow(t, {Statut:'Réalisé', 'Score (%)': Math.round(score*100), 'Audité le': new Date().toISOString(), 'Remarques': ctx.note||''});
  if(!ok){ alert("L'enregistrement a échoué — vérifiez la connexion au Google Sheet et réessayez."); if(btn){ btn.disabled=false; btn.textContent="Enregistrer l'audit"; } return; }

  // détail par critère (best-effort : le score global est déjà sauvegardé, on ne bloque pas dessus)
  const finalRow = findRow(State.weekKey, t);
  const auditId = finalRow ? finalRow['ID'] : rowId(State.weekKey, t);
  const auditorName = finalRow ? finalRow['Auditeur'] : '';
  const nowIso = new Date().toISOString();
  const detailRows = State.criteria.map((c,i)=>({
    AuditID: auditId,
    Semaine: State.weekKey,
    Service: t.service,
    Auditeur: auditorName,
    'Critère': c.label,
    'Catégorie': c.category||'',
    'Réponse': ctx.answers[i]===1?'Oui':(ctx.answers[i]===0.5?'Partiel':'Non'),
    'Score (%)': Math.round(ctx.answers[i]*100),
    'Date': nowIso
  }));
  const detailOk = await apiAppendMany('Audits_Detail', detailRows);
  if(detailOk){ State.auditDetailRows = State.auditDetailRows.concat(detailRows); }

  State.view='planning'; State.auditCtx=null;
  renderUI();
}
window.submitAudit = submitAudit;

      <button class="btn btn-primary btn-sm" id="add-crit-btn" onclick="addCriterionFromApp()">Ajouter</button>
    </div>
  </div>
  `;
}

function renderServiceLine(name){
  const meta = State.serviceMeta[name] || {active:true, row:null};
  return `<div class="cfg-line">
    <span>${escapeHtml(name)}${meta.active?'':' <span class="badge badge-neutral" style="margin-left:6px;">Non réservable</span>'}</span>
    <span class="cfg-line-actions">
      <button class="btn btn-ghost btn-sm" onclick="toggleServiceActive('${escapeAttr(name)}')">${meta.active?'Rendre non réservable':'Rendre réservable'}</button>
    </span>
  </div>`;
}

async function toggleServiceActive(name){
  const meta = State.serviceMeta[name];
  if(!meta || !meta.row){ alert("Impossible de localiser ce service dans le Sheet — cliquez sur Rafraîchir puis réessayez."); return; }
  const newActive = !meta.active;
  const ok = await apiUpdateRow('Services', meta.row, {'Nom du service': name, 'Actif': newActive?'Oui':'Non'});
  if(!ok){ alert("Échec de la mise à jour — vérifiez la connexion au Google Sheet."); return; }
  meta.active = newActive;
  renderUI();
}
window.toggleServiceActive = toggleServiceActive;

function renderTemplateLine(t){
  if(State.editingCreneauRow === t.row){
    const svcOpts = State.services.map(s=>`<option value="${escapeHtml(s)}" ${s===t.service?'selected':''}>${escapeHtml(s)}</option>`).join('');
    return `<div class="cfg-line">
      <div class="cfg-edit-row">
        <select id="edit-tpl-day-${t.row}">${DAY_NAMES.map((d,i)=>`<option value="${i}" ${i===t.day?'selected':''}>${d}</option>`).join('')}</select>
        <select id="edit-tpl-hour-${t.row}">${Array.from({length:24},(_,h)=>`<option value="${String(h).padStart(2,'0')}" ${String(h).padStart(2,'0')===t.time.split(':')[0]?'selected':''}>${String(h).padStart(2,'0')} h</option>`).join('')}</select>
        <select id="edit-tpl-min-${t.row}">${['00','15','30','45'].map(m=>`<option value="${m}" ${m===t.time.split(':')[1]?'selected':''}>${m}</option>`).join('')}</select>
        <select id="edit-tpl-service-${t.row}">${svcOpts}</select>
        <input type="text" id="edit-tpl-label-${t.row}" value="${escapeAttr(t.label||'')}" placeholder="Libellé">
        <button class="btn btn-primary btn-sm" onclick="saveTemplateEdit(${t.row})">Enregistrer</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelTemplateEdit()">Annuler</button>
      </div>
    </div>`;
  }
  return `<div class="cfg-line">
    <span><span class="t1">${DAY_NAMES[t.day]} ${t.time}</span> — <span class="t2">${escapeHtml(t.service)}</span>${t.label?` <span class="t2">· ${escapeHtml(t.label)}</span>`:''}</span>
    <span class="cfg-line-actions">
      <button class="icon-btn" onclick="duplicateTemplate(${t.row})" title="Dupliquer">${copyIcon()}</button>
      <button class="icon-btn" onclick="startTemplateEdit(${t.row})" title="Modifier">✎</button>
      <button class="icon-btn danger" onclick="deleteTemplateRow(${t.row})" title="Supprimer">${trashIcon()}</button>
    </span>
  </div>`;
}

function renderCriterionLine(c,i){
  if(State.editingCriterionRow === c.row){
    return `<div class="cfg-line">
      <div class="cfg-edit-row">
        <input type="text" id="edit-crit-input-${c.row}" value="${escapeAttr(c.label)}" style="flex:1;min-width:160px;" onkeydown="if(event.key==='Enter')saveCriterionEdit(${c.row})">
        <input type="text" id="edit-crit-category-${c.row}" value="${escapeAttr(c.category||'')}" placeholder="Catégorie (facultatif)" list="crit-categories" style="min-width:140px;">
        <button class="btn btn-primary btn-sm" onclick="saveCriterionEdit(${c.row})">Enregistrer</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelCriterionEdit()">Annuler</button>
      </div>
    </div>`;
  }
  return `<div class="cfg-line">
    <span>${c.category?`<span class="badge badge-neutral" style="margin-right:8px;">${escapeHtml(c.category)}</span>`:''}<span class="t2">${String(i+1).padStart(2,'0')}</span> ${escapeHtml(c.label)}</span>
    <span class="cfg-line-actions">
      <button class="icon-btn" onclick="startCriterionEdit(${c.row})" title="Modifier">✎</button>
      <button class="icon-btn danger" onclick="deleteCriterionRow(${c.row})" title="Supprimer">${trashIcon()}</button>
    </span>
  </div>`;
}

function trashIcon(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>`; }
function copyIcon(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>`; }

function duplicateTemplate(row){
  const t = State.templates.find(x=>x.row===row);
  if(!t) return;
  if(State.editingCreneauRow!==null){ State.editingCreneauRow = null; renderUI(); }
  const daySel = document.getElementById('new-tpl-day');
  const hourSel = document.getElementById('new-tpl-hour');
  const minSel = document.getElementById('new-tpl-min');
  const svcSel = document.getElementById('new-tpl-service');
  const labelInput = document.getElementById('new-tpl-label');
  if(!daySel || !hourSel || !minSel || !labelInput) return;
  daySel.value = String(t.day);
  hourSel.value = t.time.split(':')[0];
  minSel.value = t.time.split(':')[1];
  if(svcSel && !svcSel.disabled) svcSel.value = t.service;
  labelInput.value = t.label || '';
  const addRow = labelInput.closest('.cfg-add');
  if(addRow){
    addRow.scrollIntoView({behavior:'smooth', block:'center'});
    addRow.classList.remove('cfg-add-flash');
    void addRow.offsetWidth; // relance l'animation si cliqué plusieurs fois de suite
    addRow.classList.add('cfg-add-flash');
  }
  daySel.focus();
}
window.duplicateTemplate = duplicateTemplate;
function escapeAttr(s){ return escapeHtml(s); }

function startTemplateEdit(row){ State.editingCreneauRow = row; renderUI(); }
function cancelTemplateEdit(){ State.editingCreneauRow = null; renderUI(); }
window.startTemplateEdit = startTemplateEdit; window.cancelTemplateEdit = cancelTemplateEdit;

async function saveTemplateEdit(row){
  const t = State.templates.find(x=>x.row===row);
  if(!t) return;
  const day = document.getElementById(`edit-tpl-day-${row}`).value;
  const hour = document.getElementById(`edit-tpl-hour-${row}`).value;
  const min = document.getElementById(`edit-tpl-min-${row}`).value;
  const service = document.getElementById(`edit-tpl-service-${row}`).value;
  const label = (document.getElementById(`edit-tpl-label-${row}`).value||'').trim();
  const time = `${hour}:${min}`;
  const ok = await apiUpdateRow('Creneaux', row, {Jour: DAY_NAMES[day], Heure: time, Service: service, 'Libellé': label});
  if(!ok){ alert("Échec de la mise à jour — vérifiez la connexion au Google Sheet."); return; }
  t.day = Number(day); t.time = time; t.service = service; t.label = label;
  State.editingCreneauRow = null;
  renderUI();
}
window.saveTemplateEdit = saveTemplateEdit;

async function deleteTemplateRow(row){
  if(!confirm('Supprimer ce créneau ? Cette action est irréversible.')) return;
  const ok = await apiDeleteRow('Creneaux', row);
  if(!ok){ alert("Échec de la suppression — vérifiez la connexion au Google Sheet."); return; }
  State.templates = State.templates.filter(x=>x.row!==row);
  State.templates.forEach(x=>{ if(x.row>row) x.row -= 1; }); // les lignes suivantes remontent d'un cran dans le Sheet
  renderUI();
}
window.deleteTemplateRow = deleteTemplateRow;

function startCriterionEdit(row){ State.editingCriterionRow = row; renderUI(); }
function cancelCriterionEdit(){ State.editingCriterionRow = null; renderUI(); }
window.startCriterionEdit = startCriterionEdit; window.cancelCriterionEdit = cancelCriterionEdit;

async function saveCriterionEdit(row){
  const c = State.criteria.find(x=>x.row===row);
  if(!c) return;
  const input = document.getElementById(`edit-crit-input-${row}`);
  const label = (input.value||'').trim();
  if(!label) return;
  const category = (document.getElementById(`edit-crit-category-${row}`).value||'').trim();
  const idx = State.criteria.indexOf(c);
  const ok = await apiUpdateRow('Criteres', row, {Ordre: idx+1, 'Critère': label, 'Catégorie': category});
  if(!ok){ alert("Échec de la mise à jour — vérifiez la connexion au Google Sheet."); return; }
  c.label = label;
  c.category = category;
  State.editingCriterionRow = null;
  renderUI();
}
window.saveCriterionEdit = saveCriterionEdit;

async function deleteCriterionRow(row){
  if(!confirm('Supprimer ce critère ? Cette action est irréversible.')) return;
  const ok = await apiDeleteRow('Criteres', row);
  if(!ok){ alert("Échec de la suppression — vérifiez la connexion au Google Sheet."); return; }
  State.criteria = State.criteria.filter(x=>x.row!==row);
  State.criteria.forEach(x=>{ if(x.row>row) x.row -= 1; });
  renderUI();
}
window.deleteCriterionRow = deleteCriterionRow;

async function addServiceFromApp(){
  const input = document.getElementById('new-service-input');
  const name = (input.value||'').trim();
  if(!name) return;
  const btn = document.getElementById('add-service-btn');
  btn.disabled = true; btn.textContent = '…';
  const res = await apiAppend('Services', {'Nom du service': name});
  if(res){
    State.services.push(name);
    input.value = '';
    renderUI();
  } else {
    alert("Échec de l'enregistrement — vérifiez la connexion au Google Sheet.");
    btn.disabled=false; btn.textContent='Ajouter';
  }
}
window.addServiceFromApp = addServiceFromApp;

async function addAuditorFromApp(){
  const input = document.getElementById('new-auditor-input');
  const name = (input.value||'').trim();
  if(!name) return;
  const btn = document.getElementById('add-auditor-btn');
  btn.disabled = true; btn.textContent = '…';
  const res = await apiAppend('Auditeurs', {"Nom de l'auditeur": name});
  if(res){
    State.auditors.push(name);
    input.value = '';
    renderUI();
  } else {
    alert("Échec de l'enregistrement — vérifiez la connexion au Google Sheet.");
    btn.disabled=false; btn.textContent='Ajouter';
  }
}
window.addAuditorFromApp = addAuditorFromApp;

async function addTemplateFromApp(){
  const day = document.getElementById('new-tpl-day').value;
  const hour = document.getElementById('new-tpl-hour').value;
  const min = document.getElementById('new-tpl-min').value;
  const time = `${hour}:${min}`;
  const serviceEl = document.getElementById('new-tpl-service');
  const service = serviceEl ? serviceEl.value : '';
  const label = (document.getElementById('new-tpl-label').value||'').trim();
  if(!service) return;
  const btn = document.getElementById('add-tpl-btn');
  btn.disabled = true; btn.textContent = '…';
  const res = await apiAppend('Creneaux', {Jour: DAY_NAMES[day], Heure: time, Service: service, 'Libellé': label});
  if(res){
    State.templates.push({day:Number(day), time, service, label, row: res.row});
    renderUI();
  } else {
    alert("Échec de l'enregistrement — vérifiez la connexion au Google Sheet.");
    btn.disabled=false; btn.textContent='Ajouter';
  }
}
window.addTemplateFromApp = addTemplateFromApp;

async function addCriterionFromApp(){
  const input = document.getElementById('new-crit-input');
  const label = (input.value||'').trim();
  if(!label) return;
  const categoryInput = document.getElementById('new-crit-category');
  const category = (categoryInput.value||'').trim();
  const btn = document.getElementById('add-crit-btn');
  btn.disabled = true; btn.textContent = '…';
  const res = await apiAppend('Criteres', {Ordre: State.criteria.length+1, 'Critère': label, 'Catégorie': category});
  if(res){
    State.criteria.push({label, category, row: res.row});
    input.value = '';
    categoryInput.value = '';
    renderUI();
  } else {
    alert("Échec de l'enregistrement — vérifiez la connexion au Google Sheet.");
    btn.disabled=false; btn.textContent='Ajouter';
  }
}
window.addCriterionFromApp = addCriterionFromApp;

async function reloadAll(){
  State.loaded = false;
  await refresh({full:true});
}
window.reloadAll = reloadAll;

/* ============================= UTIL ============================= */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ============================= INIT ============================= */
refresh({full:true});
</script>
</body>
</html>
